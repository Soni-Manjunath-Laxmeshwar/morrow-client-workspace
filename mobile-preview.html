<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Morrow mobile preview</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#fff 0,#eff2ea 45%,#e0e9df 100%);font-family:Arial,sans-serif}
    .preview{display:grid;justify-items:center;gap:17px}
    .phone{position:relative;width:390px;height:844px;padding:0;border:10px solid #193a30;border-radius:43px;background:#193a30;box-shadow:0 30px 70px rgba(24,55,43,.22);overflow:hidden}
    .phone iframe{display:block;width:100%;height:100%;border:0;border-radius:31px;background:#f7f7f2}
    .notch{position:absolute;z-index:2;top:5px;left:50%;width:114px;height:21px;transform:translateX(-50%);border-radius:0 0 14px 14px;background:#193a30;pointer-events:none}
    .caption{color:#688074;font-size:10px;font-weight:700;letter-spacing:2px}
  </style>
</head>
<body>
  <div class="preview">
    <div class="phone"><iframe src="index.html" title="Morrow mobile website preview"></iframe><span class="notch"></span></div>
    <div class="caption">MORROW · MOBILE PREVIEW</div>
  </div>
</body>
</html>
