<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Layout inspection</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{border:0;width:100vw;height:100vh}pre{position:fixed;left:4px;top:4px;z-index:10;margin:0;padding:8px;background:#113;color:white;font:13px/1.4 monospace;white-space:pre-wrap;max-width:95vw}</style></head><body><iframe id="site" src="/?inspect=1"></iframe><pre id="report">loading</pre><script>const frame=document.querySelector('#site');frame.addEventListener('load',()=>setTimeout(()=>{const d=frame.contentDocument,b=d.querySelector('.menu-toggle'),n=d.querySelector('.nav-wrap'),h=d.querySelector('.hero-lede'),s=b?getComputedStyle(b):null;const data={innerWidth:innerWidth,frameWidth:frame.clientWidth,frameScrollWidth:d.documentElement.scrollWidth,button:s?{display:s.display,position:s.position,visibility:s.visibility,opacity:s.opacity,border:s.border,background:s.backgroundColor,zIndex:s.zIndex}:null,buttonRect:b?b.getBoundingClientRect().toJSON():null,navRect:n?n.getBoundingClientRect().toJSON():null,ledeRect:h?h.getBoundingClientRect().toJSON():null};document.querySelector('#report').textContent=JSON.stringify(data,null,2)},100));</script></body></html>
